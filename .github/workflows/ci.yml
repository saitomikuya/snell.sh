name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.6', cache: true}
      - uses: pnpm/action-setup@v4
        with: {version: 10.14.0}
      - uses: actions/setup-node@v4
        with: {node-version: '24.7.0', cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: gofmt -w cmd internal && git diff --exit-code
      - run: go vet ./... && go test -race ./...
      - run: pnpm install --frozen-lockfile && pnpm test && pnpm run build
        working-directory: web
      - run: docker build --build-arg VERSION=ci -t proxy-panel:ci .
