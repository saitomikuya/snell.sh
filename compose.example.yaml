services:
  proxy-panel:
    image: ${PROXY_PANEL_IMAGE}
    container_name: proxy-panel
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /opt/proxy-panel:/data
    environment:
      PANEL_BIND: ${PANEL_BIND:-0.0.0.0}
      PANEL_PORT: ${PANEL_PORT:-8080}
      PANEL_SECURE_COOKIE: ${PANEL_SECURE_COOKIE:-0}
      PANEL_AUTO_INSTALL_RUNTIMES: ${PANEL_AUTO_INSTALL_RUNTIMES:-1}
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "/usr/local/bin/panel", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
