services:
  proxy-panel:
    image: ${PROXY_PANEL_IMAGE}
    container_name: proxy-panel
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Allow the entrypoint to create /dev/net/tun when minimal hosts (such as
    # Alpine) do not create the device node before Docker starts the container.
    # The host kernel must still have the TUN module loaded.
    device_cgroup_rules:
      - 'c 10:200 rwm'
    volumes:
      - /opt/proxy-panel:/data
    environment:
      PANEL_BIND: ${PANEL_BIND:-0.0.0.0}
      PANEL_PORT: ${PANEL_PORT:-8080}
      PANEL_SECURE_COOKIE: ${PANEL_SECURE_COOKIE:-0}
      PANEL_AUTO_INSTALL_RUNTIMES: ${PANEL_AUTO_INSTALL_RUNTIMES:-1}
      PANEL_AUTO_CREATE_TUN: ${PANEL_AUTO_CREATE_TUN:-1}
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "/usr/local/bin/panel", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
